<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>The Daily Stack</title><link rel="alternate" type="application/rss+xml" href="feed.xml">
<style>body{font-family:system-ui,sans-serif;margin:0;background:#12162a;color:#eee}main{max-width:640px;margin:auto;padding:16px}
header{display:flex;gap:12px;align-items:center}header img{width:72px;border-radius:12px}audio{width:100%;margin:12px 0}
.speeds button{font-size:16px;padding:10px 14px;margin:2px;border-radius:8px;border:0;background:#2a3050;color:#eee}.speeds .on{background:#ffc43d;color:#000}
li{list-style:none;padding:12px;margin:8px 0;background:#1d2340;border-radius:10px;cursor:pointer}li.cur{outline:2px solid #ffc43d}
small{color:#aab}a{color:#7cd0ff}ul{padding:0}</style></head><body><main>
<header><img src="cover.png" alt=""><div><h1 style="margin:0">The Daily Stack</h1><a href="feed.xml">RSS feed</a></div></header>
<h3 id="now"></h3><audio id="a" controls preload="metadata"></audio>
<div class="speeds"><button data-r="1">1x</button><button data-r="1.25">1.25x</button><button data-r="1.5">1.5x</button><button data-r="2">2x</button></div>
<ul id="list"></ul></main><script>
const eps=[{"day": "2026-10-19", "title": "The Daily Stack \u2014 Monday, October 19, 2026: Anthropic's Equity Pledge, Agents Behaving Badly, and the Chip Rebound", "intro": "Welcome to The Daily Stack. It's Monday, October 19th. Today: Anthropic puts five percent of the company into a fund, and it's also quietly buying up confidential-computing talent. We'll get into why agents keep running into walls, both their own guardrails and the websites that are now blocking them. Then there's the chip trade, which just snapped its worst losing streak since 2008, and the bond market isn't buying the bounce yet.", "src": "episodes/2026-10-19.mp3", "dur": "00:14:50"}],a=document.getElementById('a'),L=document.getElementById('list');let rate=+(localStorage.rate||1);
function setRate(r){rate=r;a.playbackRate=r;localStorage.rate=r;document.querySelectorAll('.speeds button').forEach(b=>b.classList.toggle('on',+b.dataset.r==r))}
function load(i,play){a.src=eps[i].src;document.getElementById('now').textContent=eps[i].title;[...L.children].forEach((li,j)=>li.classList.toggle('cur',i==j));a.onloadedmetadata=()=>a.playbackRate=rate;if(play)a.play()}
eps.forEach((e,i)=>{const li=document.createElement('li');li.innerHTML='<b></b><br><small></small>';li.querySelector('b').textContent=e.title;li.querySelector('small').textContent=e.day+(e.dur?' · '+e.dur:'');li.onclick=()=>load(i,true);L.appendChild(li)});
document.querySelectorAll('.speeds button').forEach(b=>b.onclick=()=>setRate(+b.dataset.r));a.onplay=()=>a.playbackRate=rate;
setRate(rate);if(eps.length)load(0,false);
</script></body></html>
