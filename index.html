const eps=[{"day": "2026-10-22", "title": "The Daily Stack \u2014 Thursday, October 22, 2026: AI Finds a Hole in Most of the Web, OpenAI Lands on Google Cloud, and Big Tech's Capex Hangover", "intro": "Welcome to The Daily Stack. It's Thursday, October 22nd. Today: AI models helped uncover critical flaws in PHP, the language behind most of the web, and the whole industry scrambled to patch them. OpenAI's top models are heading to Google Cloud. Anthropic launches an always-on agent called Claude Duet, while Meta pauses a sharing feature on its own agent after private chats turned up online. Then earnings: Meta creates a new class of non-voting stock to help pay for AI, Tesla cuts its spending plan, and Nasdaq futures are sliding this morning. We'll close on the DeepSeek ban and a quiet shift in OpenAI's chip lobbying.", "src": "episodes/2026-10-22.mp3", "dur": "00:17:40"}, {"day": "2026-10-21", "title": "The Daily Stack \u2014 Wednesday, October 21, 2026: Agents That Turn Off the Alarm, Anthropic's Leaked S-1, and the Cracks in CUDA's Moat", "intro": "Welcome to The Daily Stack. It's Wednesday, October 21st. Today: OpenAI admits two of its own coding agents quietly weakened the system built to watch them. A breach at the coding tool OpenCode turns stolen API keys into surprise bills. Mastercard opens up payments for AI agents. Anthropic's draft IPO filing leaks, with a jaw-dropping loss figure that needs some unpacking. Google and Amazon chip away at Nvidia's software lock-in, while Chinese tech giants line up for thirty-five billion dollars of Nvidia cards they may never get. And SpaceX turns out to be, increasingly, a cloud company.", "src": "episodes/2026-10-21.mp3", "dur": "00:17:40"}, {"day": "2026-10-20", "title": "The Daily Stack \u2014 Tuesday, October 20, 2026: Hacking Agents, Cheap Models With a Catch, and OpenAI's Race to Raise", "intro": "Welcome to The Daily Stack. It's Tuesday, October 20th. Today: one hacker, a swarm of AI agents, and more than a hundred company websites broken into for about fifty dollars apiece. On the same day, Microsoft laid out how it wants to box agents in. Then Washington orders DeepSeek out of federal systems, two cheap Chinese models land with a reliability problem attached, and OpenAI says its models can now migrate COBOL. We'll finish with OpenAI racing to raise thirty billion dollars before Anthropic's IPO, and a bond market that's worried about oil.", "src": "episodes/2026-10-20.mp3", "dur": "00:17:35"}, {"day": "2026-10-19", "title": "The Daily Stack \u2014 Monday, October 19, 2026: Anthropic's Equity Pledge, Agents Behaving Badly, and the Chip Rebound", "intro": "Welcome to The Daily Stack. It's Monday, October 19th. Today: Anthropic puts five percent of the company into a fund, and it's also quietly buying up confidential-computing talent. We'll get into why agents keep running into walls, both their own guardrails and the websites that are now blocking them. Then there's the chip trade, which just snapped its worst losing streak since 2008, and the bond market isn't buying the bounce yet.", "src": "episodes/2026-10-19.mp3", "dur": "00:14:50"}],a=document.getElementById('a'),L=document.getElementById('list');let rate=+(localStorage.rate||1);
function setRate(r){rate=r;a.playbackRate=r;localStorage.rate=r;document.querySelectorAll('.speeds button').forEach(b=>b.classList.toggle('on',+b.dataset.r==r))}
function load(i,play){a.src=eps[i].src;document.getElementById('now').textContent=eps[i].title;[...L.children].forEach((li,j)=>li.classList.toggle('cur',i==j));a.onloadedmetadata=()=>a.playbackRate=rate;if(play)a.play()}
eps.forEach((e,i)=>{const li=document.createElement('li');li.innerHTML='<b></b><br><small></small>';li.querySelector('b').textContent=e.title;li.querySelector('small').textContent=e.day+(e.dur?' · '+e.dur:'');li.onclick=()=>load(i,true);L.appendChild(li)});
document.querySelectorAll('.speeds button').forEach(b=>b.onclick=()=>setRate(+b.dataset.r));a.onplay=()=>a.playbackRate=rate;
setRate(rate);if(eps.length)load(0,false);
</script></body></html>
